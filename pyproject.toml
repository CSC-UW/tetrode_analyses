[project]
name = "tetrode-analyses"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Graham Findlay", email = "graham.b.findlay@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "open-ephys-python-tools>=1.0.1",
    "dask",
    "numpy",
    "pandas",
    "xarray",
]

[project.optional-dependencies]
# Needed only by build_tetrode_probegroup / attach_tetrode_probegroup, which build
# a probeinterface ProbeGroup to attach to a SpikeInterface recording. The
# extractor itself is supplied by the caller, so spikeinterface is not a dependency
# here. probeinterface is a third-party PyPI package (also a transitive dependency
# of spikeinterface), imported lazily inside those functions.
si = ["probeinterface"]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_nfs: marks tests that require mounted production NFS data",
]
