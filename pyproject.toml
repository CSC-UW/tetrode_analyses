[project]
name = "tetrode-analyses"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Graham Findlay", email = "graham.b.findlay@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "open-ephys-python-tools>=1.0.1",
    "dask",
    "numpy",
    "pandas",
    "xarray",
    "probeinterface",
    "spikeinterface",
    "zarr",
]

[project.optional-dependencies]
lossy_compression = [
    "wavpack-numcodecs",
]

# Needed by tetrode_analyses.spikeinterface (get_recording / convert_recording)
# and the MountainSort5 / Kilosort4 sorting pipelines. spikeinterface pulls
# numcodecs, zarr, scipy, and probeinterface transitively; wavpack-numcodecs,
# mountainsort5, and kilosort are third-party PyPI packages. kilosort pulls torch
# (the GPU template-matcher), faiss-cpu, and numba transitively; the CUDA build of
# torch is selected only in gfys_workspace/pyproject.toml (a [tool.uv] index pin),
# so an external clone of this package still resolves plain PyPI torch.
sorting = [
    "mountainsort5",
    "kilosort>=4.1.7",
]
# Needed by tetrode_analyses.power (instantaneous + STFT bandpower) and
# tetrode_analyses.plotting (SWA timetraces). ecephys supplies the signal
# processing (xrsig/npsig: bandpass, Hilbert, decimation, STFT) and pulls scipy +
# ssqueezepy transitively. ecephys is a sibling workspace package, declared as a
# direct git URL per the workspace dual-use install pattern (only gfys_workspace
# overrides it to a local editable path). zarr backs the on-disk xarray products.
analysis = [
    "ecephys @ git+https://github.com/CSC-UW/ecephys.git@develop",
    "matplotlib",
    "seaborn",
]
# Needed by tetrode_analyses' curation/launch_curation.py to run the
# spikeinterface-gui app (Qt desktop + Panel web backends). Points at the `dev`
# integration branch of the grahamfindlay fork rather than the PyPI release (latest
# is 0.13.1). dev = upstream main -- which carries the int32 scrollbar fix that
# enables curation of long (>2**31-sample) recordings (commit e1b5e7a, PR #263,
# not yet in any PyPI release) -- plus local sigui CLI `--recording` fixes (correct
# args.recording_base_folder attribute + fail-loud exception handling). Direct git
# URL per the workspace dual-use install pattern; gfys_workspace pins the same
# fork via override-dependencies (currently the dev branch).
curation = [
    "spikeinterface-gui[desktop,web] @ git+https://github.com/grahamfindlay/spikeinterface-gui.git@dev",
]
# Needed by the local loupe viewer in
# analyses/tetrode_preprocessing_and_sorting/visualization/launch_loupe.py. The
# viewer is deliberately SpikeInterface-free: it reads a pre-built "viz bundle"
# (plain-xarray zarrs + a spikes parquet, produced on the server by
# visualization/build_bundle.py) rather than SI sortings/recordings, so the only
# extra it needs is loupe. loupe pulls polars, xarray, zarr, and numpy
# transitively; base tetrode_analyses supplies the rest (and its viz palette via
# tetrode_analyses.viz, which imports no SI). loupe is a sibling workspace
# package, declared as a direct git URL per the workspace dual-use install
# pattern (gfys_workspace pins the same CSC-UW/loupe@main via override-dependencies).
viz = [
    "loupe @ git+https://github.com/CSC-UW/loupe.git@main",
]
# Needed by tetrode_analyses.unitrefine_advisory (advisory noise/neural ranking for tetrode
# sortings, retrained from UnitRefine's published training data -- see sorting scripts 47-50).
# scikit-learn and joblib already arrive transitively via spikeinterface's quality-metrics stack;
# huggingface_hub is the only genuine addition, used once to download + cache the training CSVs (the
# fitted model and CSVs are cached locally thereafter, so reuse on future datasets needs only
# scikit-learn + joblib, offline). All three are plain PyPI packages.
advisory = [
    "scikit-learn",
    "huggingface-hub",
    "joblib",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_nfs: marks tests that require mounted production NFS data",
]
