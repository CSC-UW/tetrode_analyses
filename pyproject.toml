[project]
name = "tetrode-analyses"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Graham Findlay", email = "graham.b.findlay@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "open-ephys-python-tools>=1.0.1",
    "dask",
    "numpy",
    "pandas",
    "xarray",
]

[project.optional-dependencies]
# Needed by tetrode_analyses.spikeinterface (get_recording / convert_recording)
# and the MountainSort5 sorting pipeline. spikeinterface pulls numcodecs, zarr,
# scipy, and probeinterface transitively; wavpack-numcodecs and mountainsort5 are
# third-party PyPI packages.
sorting = [ 
    "probeinterface",
    "spikeinterface",
    "mountainsort5",
    "wavpack-numcodecs",
]
# Needed by tetrode_analyses.power (instantaneous + STFT bandpower) and
# tetrode_analyses.plotting (SWA timetraces). ecephys supplies the signal
# processing (xrsig/npsig: bandpass, Hilbert, decimation, STFT) and pulls scipy +
# ssqueezepy transitively. ecephys is a sibling workspace package, declared as a
# direct git URL per the workspace dual-use install pattern (only gfys_workspace
# overrides it to a local editable path). zarr backs the on-disk xarray products.
analysis = [
    "ecephys @ git+https://github.com/CSC-UW/ecephys.git@develop",
    "matplotlib",
    "seaborn",
    "zarr",
]
# Needed by tetrode_analyses' curation/launch_curation.py to run the
# spikeinterface-gui app (Qt desktop + Panel web backends). Pinned to the upstream
# git main branch rather than the PyPI release (latest is 0.13.1) because the int32
# scrollbar fix that enables curation of long (>2**31-sample) recordings -- commit
# e1b5e7a, PR #263 "Fix int32 error once and for all" -- is merged on main but not
# yet in any PyPI release. Direct git URL per the workspace dual-use install pattern;
# only gfys_workspace overrides it to a local editable path.
curation = [
    "spikeinterface-gui[desktop,web] @ git+https://github.com/SpikeInterface/spikeinterface-gui.git@main",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_nfs: marks tests that require mounted production NFS data",
]
